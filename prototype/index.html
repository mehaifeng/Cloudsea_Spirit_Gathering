<title>云海拾灵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap">
<style>
/* Layout: full-bleed 3D world; glass HUD floats at the edges, creature card docks right (desktop) or bottom (phone). Single committed look over a painted sky. */
:root{
  --ink:#f7f0e4; --ink-dim:rgba(247,240,228,.74); --ink-dark:#2a1f14;
  --glass:rgba(24,32,56,.5); --glass-strong:rgba(20,26,48,.82); --line:rgba(255,236,210,.2);
  --amber:#ffb54a; --coral:#e2734f;
  --display:"ZCOOL XiaoWei","Songti SC","STSong","Noto Serif SC",serif;
  --ui:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:#8db3dc;color:var(--ink);font-family:var(--ui);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.logo{font-family:var(--display);font-size:30px;line-height:1.1;letter-spacing:.1em;text-shadow:0 1px 3px rgba(22,30,60,.55),0 2px 16px rgba(22,30,60,.5)}
.sub{font-size:11px;letter-spacing:.22em;color:var(--ink);opacity:.85;margin-top:4px;text-shadow:0 1px 3px rgba(22,30,60,.7)}
.actions{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
button{font:inherit;cursor:pointer}
.chip{font-size:13px;color:var(--ink);background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:8px 15px;border-radius:999px;transition:background .2s}
.chip:hover{background:rgba(40,50,84,.66)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font-size:12px;color:var(--ink-dim);background:rgba(20,28,50,.38);padding:6px 14px;border-radius:999px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#btnPet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 56px);background:var(--amber);color:var(--ink-dark);border:none;font-weight:600;font-size:15px;padding:12px 24px;border-radius:999px;box-shadow:0 8px 24px rgba(255,170,60,.38)}
#stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:1.5px solid rgba(255,255,255,.42);background:rgba(20,28,50,.22);pointer-events:none}
#stick .knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:rgba(255,246,232,.88);box-shadow:0 4px 12px rgba(0,0,0,.2)}
#card{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 88px);width:320px;max-height:calc(100% - 190px);overflow:auto;background:var(--glass-strong);border:1px solid var(--line);border-radius:18px;padding:18px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 18px 50px rgba(10,14,30,.35);touch-action:pan-y}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cname{font-family:var(--display);font-size:28px;letter-spacing:.06em;line-height:1.1}
.cmeta{font-size:12px;color:var(--ink-dim);margin-top:6px;font-variant-numeric:tabular-nums}
.x{background:none;border:none;color:var(--ink-dim);font-size:24px;line-height:1;padding:2px 6px}
.elem{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid color-mix(in srgb,var(--c) 55%,transparent)}
.elem i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.sect{font-size:11px;letter-spacing:.2em;color:var(--ink-dim);margin:16px 0 8px}
#cSkills{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#cSkills li{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:baseline;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.05)}
#cSkills .part{font-size:11px;color:var(--ink-dim);min-width:3.2em}
#cSkills b{font-weight:600;font-size:14px}
#cSkills .tag{font-size:11px;color:var(--c)}
#cSkills p{grid-column:2 / 4;margin:0;font-size:12px;line-height:1.5;color:var(--ink-dim)}
.genes{margin-top:12px;font-family:var(--mono);font-size:11px;color:var(--ink-dim);letter-spacing:.06em}
.cact{display:flex;gap:8px;margin-top:14px}
.cact button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);font-size:14px}
.cact button.primary{background:var(--amber);color:var(--ink-dark);border-color:transparent;font-weight:600}
.note{font-size:11px;color:var(--ink-dim);margin-top:12px;line-height:1.5}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 86px);transform:translateX(-50%);background:var(--glass-strong);border:1px solid var(--line);padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .35s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
[hidden]{display:none!important}
#err{position:fixed;inset:0;display:grid;place-items:center;background:#1b2238;color:var(--ink);padding:24px;text-align:center;font-size:14px}
@media (max-width:640px){
  .logo{font-size:24px}
  #card{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:auto;max-height:54%}
  body.card-open .tip,body.card-open #btnPet{display:none}
}
</style>

<canvas id="c" tabindex="0" aria-label="云海拾灵 世界岛"></canvas>
<div class="top">
  <div><div class="logo">云海拾灵</div><div class="sub">世界岛 · 原型 0.1</div></div>

</div>

<div id="stick" hidden><div class="knob" id="knob"></div></div>

  <div class="chead">
    <div><div class="cname" id="cName"></div><div class="cmeta" id="cMeta"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('err').hidden=false;return;}
const T=THREE;

/* ---------------- utils ---------------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function hash2(x,y){const h=Math.sin(x*127.1+y*311.7)*43758.5453123;return h-Math.floor(h);}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y){let s=0,a=.5,f=1;for(let i=0;i<4;i++){s+=a*vnoise(x*f,y*f);f*=2;a*=.5;}return s;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;}
const _q=new T.Quaternion(),_e=new T.Euler();
function M(x,y,z,rx=0,ry=0,rz=0,sx=1,sy=sx,sz=sx){return new T.Matrix4().compose(new T.Vector3(x,y,z),_q.clone().setFromEuler(_e.set(rx,ry,rz)),new T.Vector3(sx,sy,sz));}
const C=h=>new T.Color(h);
const isTouch=matchMedia('(pointer:coarse)').matches;

/* ---------------- renderer / scene ---------------- */
const canvas=document.getElementById('c');
const renderer=new T.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,isTouch?1.75:2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();
const camera=new T.PerspectiveCamera(50,1,.1,900);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

const DAY={top:0x5b92cf,hor:0xf8dcc3,low:0xfff3e6,fog:0xf2dccb,sun:0xffe2b8,hs:0xdbe8ff,hg:0x8d9a6c,hi:.78,sc:0xfff0d8,si:1.05,cl:0xfff8ef,cs:0xd6c3c8};
const NIGHT={top:0x0b1430,hor:0x3b3f6c,low:0x575d8c,fog:0x2b3058,sun:0x8ea6ff,hs:0x5e6db0,hg:0x151a2c,hi:.32,sc:0x9cb2ff,si:.24,cl:0x5c6392,cs:0x272b50};
const sunDir=new T.Vector3(-.55,.62,.45).normalize();
scene.fog=new T.Fog(DAY.fog,38,190);

/* sky */
const skyU={uTop:{value:C(DAY.top)},uHor:{value:C(DAY.hor)},uLow:{value:C(DAY.low)},uSun:{value:C(DAY.sun)},uSunDir:{value:sunDir.clone()},uStar:{value:0}};
const sky=new T.Mesh(new T.SphereGeometry(400,32,16),new T.ShaderMaterial({uniforms:skyU,side:T.BackSide,depthWrite:false,
 vertexShader:`varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`uniform vec3 uTop,uHor,uLow,uSun,uSunDir;uniform float uStar;varying vec3 vD;
 float h3(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}
 void main(){vec3 d=normalize(vD);float y=d.y;vec3 c=y>0.?mix(uHor,uTop,smoothstep(0.,.55,y)):mix(uHor,uLow,smoothstep(0.,-.22,y));
 float s=max(dot(d,normalize(uSunDir)),0.);c+=uSun*(pow(s,60.)*.7+pow(s,6.)*.14);
 if(uStar>.01){vec3 g=floor(d*170.);float r=h3(g);c+=vec3(step(.9965,r)*smoothstep(.04,.35,y)*uStar*(.5+.5*h3(g+1.3)));}
 gl_FragColor=vec4(c,1.);}`}));
sky.renderOrder=-1;scene.add(sky);

/* lights */
const hemi=new T.HemisphereLight(DAY.hs,DAY.hg,DAY.hi);scene.add(hemi);
const sun=new T.DirectionalLight(DAY.sc,DAY.si);sun.position.copy(sunDir).multiplyScalar(40);
sun.castShadow=true;const sm=isTouch?1024:2048;sun.shadow.mapSize.set(sm,sm);
Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,near:1,far:100});
sun.shadow.bias=-.0006;sun.shadow.normalBias=.03;scene.add(sun);scene.add(sun.target);

/* cloud sea */
const seaU={uTime:{value:0},uCol:{value:C(DAY.cl)},uShade:{value:C(DAY.cs)},uFog:{value:C(DAY.fog)},uCam:{value:new T.Vector3()}};
const NOISE=`float hh(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n2(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);return mix(mix(hh(i),hh(i+vec2(1,0)),u.x),mix(hh(i+vec2(0,1)),hh(i+vec2(1,1)),u.x),u.y);}
float fb(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*n2(p);p*=2.03;a*=.5;}return s;}`;
const seaGeo=new T.PlaneGeometry(700,700,110,110);seaGeo.rotateX(-Math.PI/2);
const sea=new T.Mesh(seaGeo,new T.ShaderMaterial({uniforms:seaU,
 vertexShader:`uniform float uTime;varying vec3 vW;varying float vH;void main(){vec4 w=modelMatrix*vec4(position,1.);
 float h=sin(w.x*.06+uTime*.4)*.8+cos(w.z*.05+uTime*.3)*.7+sin((w.x+w.z)*.11+uTime*.7)*.3;w.y+=h;vH=h;vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
 fragmentShader:`uniform vec3 uCol,uShade,uFog,uCam;uniform float uTime;varying vec3 vW;varying float vH;${NOISE}
 void main(){vec2 p=vW.xz*.03;float n=fb(p+vec2(uTime*.012,uTime*.007));float m=fb(p*2.7-vec2(uTime*.02,-uTime*.01));
 float v=smoothstep(.32,.85,n*.75+m*.35+vH*.07);vec3 c=mix(uShade,uCol,v);float d=length(vW.xz-uCam.xz);
 c=mix(c,uFog,smoothstep(30.,230.,d));gl_FragColor=vec4(c,1.);}`}));
sea.position.y=-11;scene.add(sea);

/* shared mats */
const matCache={};
function mat(hex,opts){const k=hex+(opts?JSON.stringify(opts):'');if(!matCache[k])matCache[k]=new T.MeshStandardMaterial(Object.assign({color:hex,flatShading:true,roughness:.9,metalness:0},opts||{}));return matCache[k];}
const lanternMat=new T.MeshStandardMaterial({color:0xffd59a,emissive:0xffa340,emissiveIntensity:.3,flatShading:true});
function texCanvas(draw,s=64){const cv=document.createElement('canvas');cv.width=cv.height=s;draw(cv.getContext('2d'),s);const t=new T.CanvasTexture(cv);return t;}
const glowTex=texCanvas((g,s)=>{const gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);gr.addColorStop(0,'rgba(255,220,150,1)');gr.addColorStop(.35,'rgba(255,170,70,.45)');gr.addColorStop(1,'rgba(255,150,50,0)');g.fillStyle=gr;g.fillRect(0,0,s,s);});
const heartTex=texCanvas((g,s)=>{g.fillStyle='#ff7d92';g.beginPath();const k=s/64;g.moveTo(32*k,54*k);g.bezierCurveTo(6*k,36*k,6*k,14*k,20*k,12*k);g.bezierCurveTo(27*k,11*k,31*k,16*k,32*k,20*k);g.bezierCurveTo(33*k,16*k,37*k,11*k,44*k,12*k);g.bezierCurveTo(58*k,14*k,58*k,36*k,32*k,54*k);g.fill();});
const puffTex=texCanvas((g,s)=>{const gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(.6,'rgba(255,255,255,.45)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,s,s);});
const glows=[];
function addGlow(parent,y,s){const sp=new T.Sprite(new T.SpriteMaterial({map:glowTex,transparent:true,depthWrite:false,blending:T.AdditiveBlending,opacity:0}));sp.position.y=y;sp.scale.setScalar(s);parent.add(sp);glows.push(sp);return sp;}

/* ---------------- island builder ---------------- */
function makeIsland(o){
  const {R,seed,N,SEG,depth}=o;const off=seed*13.7+1.3;const K=o.K||7;
  const rim=th=>R*(1+(fbm(Math.cos(th)*1.4+off,Math.sin(th)*1.4-off)-.5)*.26);
  const H=(x,z)=>{const th=Math.atan2(z,x),t=Math.hypot(x,z)/rim(th);
    let h=(fbm(x*.11+off,z*.11-off)-.45)*1.7*(o.amp||1);
    if(o.hill){const [hx,hz,hs,ha]=o.hill;h+=Math.exp(-((x-hx)**2+(z-hz)**2)/hs)*ha;}
    if(o.flat)for(const f of o.flat){const d=Math.hypot(x-f[0],z-f[1]);h=lerp(f[3],h,smooth(f[2]*.55,f[2],d));}
    const e=1-smooth(.8,1.02,t);return h*e-(1-e)*.8;};
  const pos=[],col=[],c=new T.Color();
  const tri=(a,b,d,cl)=>{pos.push(a[0],a[1],a[2],b[0],b[1],b[2],d[0],d[1],d[2]);for(let k=0;k<3;k++)col.push(cl.r,cl.g,cl.b);};
  const rings=[];
  for(let i=0;i<=N;i++){const row=[];for(let j=0;j<SEG;j++){let th=j/SEG*Math.PI*2;
    if(i>0&&i<N)th+=(hash2(i*3.1+off,j*1.7)-.5)*.55*(Math.PI*2/SEG);
    let rr=i===0?0:rim(th)*(i/N);if(i>0&&i<N)rr*=1+(hash2(j*2.3,i+off)-.5)*.06;
    const x=Math.cos(th)*rr,z=Math.sin(th)*rr;row.push([x,H(x,z),z]);}rings.push(row);}
  const topCol=(a,b,d)=>o.topColor((a[0]+b[0]+d[0])/3,(a[1]+b[1]+d[1])/3,(a[2]+b[2]+d[2])/3,c);
  for(let i=1;i<=N;i++)for(let j=0;j<SEG;j++){const j2=(j+1)%SEG;const a=rings[i-1][j],b=rings[i-1][j2],cc=rings[i][j],d=rings[i][j2];
    tri(a,d,cc,topCol(a,d,cc));if(i>1)tri(a,b,d,topCol(a,b,d));}
  const rock=(k,j)=>{const r=hash2(k*7.7+off,j*3.3);if(k===1)return c.setHSL(.08,.34,.36+r*.05);
    return c.setHSL(.06+r*.025,.13+r*.06,.5-k/K*.2+(k%2?.04:-.02)+r*.04);};
  let prev=rings[N];
  for(let k=1;k<=K;k++){const f=k/K,row=[];
    for(let j=0;j<SEG;j++){const p=rings[N][j],th=Math.atan2(p[2],p[0]);
      const rr=rim(th)*(1-Math.pow(f,.85)*.93)*(1+(hash2(j*1.9+off,k*2.7)-.5)*.2);
      const y=p[1]-.35-f*depth*(.8+.4*hash2(k*5.1,j+off));row.push([Math.cos(th)*rr,y,Math.sin(th)*rr]);}
    for(let j=0;j<SEG;j++){const j2=(j+1)%SEG;const a=prev[j],b=prev[j2],cc=row[j],d=row[j2];tri(a,cc,d,rock(k,j));tri(a,d,b,rock(k,j+.5));}
    prev=row;}
  let minY=0;for(const p of prev)minY=Math.min(minY,p[1]);
  const tip=[(hash2(off,1)-.5)*R*.15,minY-depth*.3,(hash2(off,2)-.5)*R*.15];
  for(let j=0;j<SEG;j++)tri(prev[j],tip,prev[(j+1)%SEG],rock(K,j*1.3));
  const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setAttribute('color',new T.Float32BufferAttribute(col,3));g.computeVertexNormals();
  const mesh=new T.Mesh(g,new T.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:.95,side:T.DoubleSide}));
  mesh.receiveShadow=true;
  return {mesh,H,rim};
}

/* main island */
const PATH=[[-5,4],[-2.6,2.3],[0,.6],[2.8,-1.4],[5,-3.6]];
function distSeg(px,pz,a,b){const vx=b[0]-a[0],vz=b[1]-a[1];const t=clamp(((px-a[0])*vx+(pz-a[1])*vz)/(vx*vx+vz*vz),0,1);return Math.hypot(px-a[0]-vx*t,pz-a[1]-vz*t);}
function onPath(x,z){let d=9;for(let i=0;i<PATH.length-1;i++)d=Math.min(d,distSeg(x,z,PATH[i],PATH[i+1]));return d<.7+(fbm(x*.8,z*.8)-.5)*.6;}
const FIELD={x:4.6,z:4.1,w:3.2,d:2.6};
const inField=(x,z)=>Math.abs(x-FIELD.x)<FIELD.w/2&&Math.abs(z-FIELD.z)<FIELD.d/2;
const HUT={x:-5.2,z:4.2};
const IS=makeIsland({R:15,seed:0,N:24,SEG:64,depth:13,K:8,hill:[5,-4,14,2.1],
  flat:[[HUT.x,HUT.z,3.6,.15],[FIELD.x,FIELD.z,2.8,.1],[0,0,2.2,.1]],
  topColor:(x,y,z,c)=>{const n=fbm(x*.35+9,z*.35-4);
    if(inField(x,z))return c.setHSL(.07,.36,.36+(n-.5)*.08);
    if(onPath(x,z))return c.setHSL(.09,.4,.66+(n-.5)*.08);

function Rig(){this.pos=[];this.col=[];this.si=[];this.sw=[];this.bones=[];this.bw=[];}
Rig.prototype.bone=function(name,parent,x,y,z){const b=new T.Bone();b.name=name;const i=this.bones.length;this.bones.push(b);this.bw.push(new T.Vector3(x,y,z));
  if(parent>=0){const p=this.bw[parent];b.position.set(x-p.x,y-p.y,z-p.z);this.bones[parent].add(b);}else b.position.set(x,y,z);return i;};
Rig.prototype.add=function(geo,m4,colorFn,wFn){const g=geo.index?geo.toNonIndexed():geo;const a=g.attributes.position;const v=new T.Vector3(),lc=new T.Vector3();
  for(let i=0;i<a.count;i+=3){lc.set((a.getX(i)+a.getX(i+1)+a.getX(i+2))/3,(a.getY(i)+a.getY(i+1)+a.getY(i+2))/3,(a.getZ(i)+a.getZ(i+1)+a.getZ(i+2))/3);
    const c=typeof colorFn==='function'?colorFn(lc):colorFn;
    for(let k=0;k<3;k++){v.set(a.getX(i+k),a.getY(i+k),a.getZ(i+k));const lx=v.x,ly=v.y,lz=v.z;v.applyMatrix4(m4);
      this.pos.push(v.x,v.y,v.z);this.col.push(c.r,c.g,c.b);const w=wFn(lx,ly,lz,v);
      this.si.push(w[0],w[2]||0,0,0);this.sw.push(w[1],w[3]||0,0,0);}}};
Rig.prototype.build=function(material){const g=new T.BufferGeometry();
  g.setAttribute('position',new T.Float32BufferAttribute(this.pos,3));g.setAttribute('color',new T.Float32BufferAttribute(this.col,3));
  g.setAttribute('skinIndex',new T.Uint16BufferAttribute(this.si,4));g.setAttribute('skinWeight',new T.Float32BufferAttribute(this.sw,4));g.computeVertexNormals();
  const mesh=new T.SkinnedMesh(g,material);mesh.add(this.bones[0]);mesh.updateMatrixWorld(true);mesh.bind(new T.Skeleton(this.bones));
  mesh.frustumCulled=false;mesh.castShadow=true;mesh.receiveShadow=true;const B={};this.bones.forEach(b=>B[b.name]=b);mesh.userData.B=B;return mesh;};
const rigid=b=>()=>[b,1];
const segW=(b,p,len)=>(lx,ly)=>{const t=clamp(-ly/len,0,1);if(t<.35){const w=.5+t/.7;return[b,w,p,1-w];}return[b,1];};

/* two-bone IK in the leg plane. target/hip in root space; kneeSign +1 = knee forward */
function solveLeg(th,sh,ft,hip,tg,a,b,kneeSign){
  const dx=tg.x-hip.x,dy=tg.y-hip.y,dz=tg.z-hip.z;const V=Math.hypot(dx,dy);const roll=Math.atan2(dx,-dy);
  let L=Math.hypot(V,dz);L=clamp(L,Math.abs(a-b)+1e-3,a+b-1e-3);const phi=Math.atan2(dz,V);
  const alpha=Math.acos(clamp((a*a+L*L-b*b)/(2*a*L),-1,1));const bend=Math.PI-Math.acos(clamp((a*a+b*b-L*L)/(2*a*b),-1,1));
  th.rotation.order='ZXY';th.rotation.set(-(phi+alpha*kneeSign),0,roll);sh.rotation.set(bend*kneeSign,0,0);
  ft.rotation.set(-(th.rotation.x+sh.rotation.x),0,-roll);}
function gaitFoot(p,S,lift){p-=Math.floor(p);if(p<.5)return[S/2-S*(p/.5),0];const q=(p-.5)/.5;return[-S/2+S*(.5-.5*Math.cos(Math.PI*q)),Math.sin(Math.PI*q)*lift];}

    li.innerHTML=`<span class="part"></span><b></b><span class="tag"></span><p></p>`;li.children[0].textContent=s.p;li.children[1].textContent=s.n;li.children[2].textContent=ELEM[s.e].k;li.children[3].textContent=s.d;ul.appendChild(li);}

let night=0,nightT=0;

/* ---------------- loop ---------------- */
const tA=new T.Color(),tB=new T.Color();
function mixC(out,a,b,t){return out.copy(tA.set(a)).lerp(tB.set(b),t);}
const qT=new T.Quaternion(),qH=new T.Quaternion(),eT=new T.Euler();
function updatePlayer(dt,t){
  let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+stick.x,iy=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-stick.y;
  const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m;}const mag=Math.min(1,m);
  const fx_=-Math.sin(camYaw),fz=-Math.cos(camYaw),rx=Math.cos(camYaw),rz=-Math.sin(camYaw);
  const mx=rx*ix+fx_*iy,mz=rz*ix+fz*iy;
  if(mag>.08)P.yawT=Math.atan2(mx,mz);
  const run=keys.ShiftLeft||keys.ShiftRight;const target=mag*(run?4.6:3.1);
  P.speed=lerp(P.speed,target,Math.min(1,dt*(target>P.speed?6:9)));
  P.yaw+=angDiff(P.yaw,P.yawT)*Math.min(1,dt*10);
  if(mag>.02){const l=Math.hypot(mx,mz)||1;P.x+=mx/l*P.speed*dt;P.z+=mz/l*P.speed*dt;}else{P.x+=Math.sin(P.yaw)*P.speed*dt;P.z+=Math.cos(P.yaw)*P.speed*dt;}
  for(const o of obstacles)push(P,o.x,o.z,o.r+.3);
  const th=Math.atan2(P.z,P.x),lim=IS.rim(th)*.86,rr=Math.hypot(P.x,P.z);if(rr>lim){P.x*=lim/rr;P.z*=lim/rr;}
  const gy=groundH(P.x,P.z);PL.group.position.set(P.x,gy,P.z);PL.group.rotation.y=P.yaw;
  const B=PL.B,w=clamp(P.speed/1.4,0,1),stride=.3+.11*P.speed;P.phase+=dt*Math.max(P.speed,.15)/(2*stride);
  const cy=Math.cos(P.yaw),sy=Math.sin(P.yaw);const feet=[];
  for(const [L,s,off] of[['L',1,0],['R',-1,.5]]){const gf=gaitFoot(P.phase+off,stride,.1+.035*P.speed);const lx=.11*s,lz=gf[0]*w;
    const wx=P.x+lx*cy+lz*sy,wz=P.z-lx*sy+lz*cy;feet.push({L,lx,lz,y:groundH(wx,wz)-gy,lift:gf[1]*w});}
  const hipsY=.88+Math.cos(P.phase*Math.PI*4)*.028*w+Math.min(0,feet[0].y,feet[1].y)+Math.sin(t*1.8)*.006*(1-w);
  B.hips.position.y=hipsY;
  for(const f of feet)solveLeg(B['th'+f.L],B['sh'+f.L],B['ft'+f.L],{x:f.lx,y:hipsY-.04,z:0},{x:f.lx,y:f.y+.06+f.lift,z:f.lz},.42,.4,1);
  const sw=Math.cos(P.phase*Math.PI*2);
  B.spine.rotation.set(.1*w*Math.min(P.speed/3,1.3)+Math.sin(t*1.8)*.015,Math.sin(P.phase*Math.PI*2)*.12*w,Math.sin(P.phase*Math.PI*2)*.03*w);
  B.chest.rotation.y=-B.spine.rotation.y*.6;
  B.uaL.rotation.set(sw*.55*w,0,.12+Math.sin(t*1.8)*.02);B.faL.rotation.x=-.25-.25*w;
  B.uaR.rotation.set(-.2-sw*.2*w,0,-.14);B.faR.rotation.x=-.85;
  let hy=0,best=5;for(const c of creatures){const d=Math.hypot(c.x-P.x,c.z-P.z);if(d<best){best=d;hy=clamp(angDiff(P.yaw,Math.atan2(c.x-P.x,c.z-P.z)),-1,1);}}
  P.headY=lerp(P.headY,hy,Math.min(1,dt*3));B.head.rotation.set(.06+(best<5?.08:0),P.headY,Math.sin(t*.7)*.04*(1-w));
  [B.sc0,B.sc1,B.sc2].forEach((b,i)=>{const tg=(clamp(P.speed*.2,0,.9)+.05)*[1,.55,.45][i]+Math.sin(t*10-i*1.3)*.08*w;P.scv[i]+=((tg-P.sc[i])*70-P.scv[i]*8)*dt;P.sc[i]+=P.scv[i]*dt;b.rotation.x=P.sc[i];});
  // lantern pendulum
  const acc=(P.speed-P.prevSpeed)/Math.max(dt,1e-3),yr=angDiff(P.prevYaw,P.yaw)/Math.max(dt,1e-3);P.prevSpeed=P.speed;P.prevYaw=P.yaw;
  const L=P.L;L.vx+=(-30*L.ax-3*L.vx+acc*.55+Math.sin(P.phase*Math.PI*4)*2.2*w)*dt;L.vz+=(-30*L.az-3*L.vz-yr*P.speed*.35)*dt;L.ax=clamp(L.ax+L.vx*dt,-.9,.9);L.az=clamp(L.az+L.vz*dt,-.9,.9);
  PL.group.updateMatrixWorld(true);B.hdR.getWorldQuaternion(qH);qT.setFromEuler(eT.set(L.ax,0,L.az));qT.premultiply(PL.group.quaternion);PL.pivot.quaternion.copy(qH.invert().multiply(qT));
}
let last=performance.now(),t=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  updatePlayer(dt,t);for(const c of creatures)c.update(dt,t);
  // camera
  camGoal.set(P.x,groundH(P.x,P.z)+1.15,P.z);camT.lerp(camGoal,Math.min(1,dt*6));
  const cp=Math.cos(camPitch);camera.position.set(camT.x+Math.sin(camYaw)*cp*camDist,camT.y+Math.sin(camPitch)*camDist,camT.z+Math.cos(camYaw)*cp*camDist);
  const cth=Math.atan2(camera.position.z,camera.position.x);if(Math.hypot(camera.position.x,camera.position.z)<IS.rim(cth))camera.position.y=Math.max(camera.position.y,groundH(camera.position.x,camera.position.z)+.6);
  camera.lookAt(camT);sky.position.copy(camera.position);
  // day / night
  night+=(nightT-night)*Math.min(1,dt*1.4);const n=night;
  mixC(skyU.uTop.value,DAY.top,NIGHT.top,n);mixC(skyU.uHor.value,DAY.hor,NIGHT.hor,n);mixC(skyU.uLow.value,DAY.low,NIGHT.low,n);mixC(skyU.uSun.value,DAY.sun,NIGHT.sun,n);skyU.uStar.value=n;
  mixC(scene.fog.color,DAY.fog,NIGHT.fog,n);mixC(seaU.uFog.value,DAY.fog,NIGHT.fog,n);mixC(seaU.uCol.value,DAY.cl,NIGHT.cl,n);mixC(seaU.uShade.value,DAY.cs,NIGHT.cs,n);
  mixC(hemi.color,DAY.hs,NIGHT.hs,n);mixC(hemi.groundColor,DAY.hg,NIGHT.hg,n);hemi.intensity=lerp(DAY.hi,NIGHT.hi,n);mixC(sun.color,DAY.sc,NIGHT.sc,n);sun.intensity=lerp(DAY.si,NIGHT.si,n);
  lanternMat.emissiveIntensity=.3+n*2.2;for(const gsp of glows)gsp.material.opacity=n*.85;PL.light.intensity=n*1.7;
  moteMat.color.setHSL(lerp(.11,.12,n),lerp(.6,1,n),lerp(.92,.65,n));moteMat.opacity=.5+n*.45;moteMat.size=.08+n*.05;
  seaU.uTime.value=t;seaU.uCam.value.copy(camera.position);
  sun.position.set(P.x+sunDir.x*40,sunDir.y*40,P.z+sunDir.z*40);sun.target.position.set(P.x,0,P.z);
  for(let i=0;i<MN;i++){const s=moteSeed[i];motePos[i*3]=s[0]+Math.sin(t*.3+s[3])*.8;motePos[i*3+1]=groundH(s[0],s[2])*.0+s[1]+Math.sin(t*.7+s[3]*2)*.35;motePos[i*3+2]=s[2]+Math.cos(t*.25+s[3])*.8;}
  moteGeo.attributes.position.needsUpdate=true;
  for(const tr of trees)tr.fol.rotation.z=Math.sin(t*1.2+tr.ph)*.035;
  for(const f of farIslands)f.g.position.y=f.y+Math.sin(t*.3+f.ph)*.6;
  for(const c of clouds){c.th+=c.sp*dt;c.g.position.x=Math.cos(c.th)*c.d;c.g.position.z=Math.sin(c.th)*c.d;}
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.life-=dt;f.sp.position.x+=f.vx*dt;f.sp.position.y+=f.vy*dt;f.sp.position.z+=f.vz*dt;f.vx*=.97;f.vz*=.97;
    f.sp.material.opacity=clamp(f.life/f.max,0,1);if(f.life<=0){scene.remove(f.sp);f.sp.material.dispose();fx.splice(i,1);}}
  // nearest creature + ring
  near=null;let nd=2.4;for(const c of creatures){const d=Math.hypot(c.x-P.x,c.z-P.z);if(d<nd){nd=d;near=c;}}
  btnPet.hidden=!near;if(near)btnPet.textContent=`抚摸 ${near.g.name}`;
  if(sel){selRing.visible=true;selRing.position.set(sel.x,groundH(sel.x,sel.z)+.04,sel.z);selRing.scale.setScalar(sel.g.size*1.6+Math.sin(t*4)*.05);}else selRing.visible=false;
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').style.opacity=0;}
  renderer.render(scene,camera);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
