  <circle cx="220" cy="266" r="6" fill="#3B2E28"/>
  <circle cx="194" cy="264" r="2" fill="#FFFFFF"/>
  <circle cx="222" cy="264" r="2" fill="#FFFFFF"/>
  <ellipse cx="182" cy="280" rx="7" ry="4" fill="#F3A08A" opacity="0.7"/>
  <ellipse cx="230" cy="280" rx="7" ry="4" fill="#F3A08A" opacity="0.7"/>
  <path d="M206 214 Q214 196 228 198 Q216 206 214 220 Z" fill="#9CCB6E"/>
</svg>
