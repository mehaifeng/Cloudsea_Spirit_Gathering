<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 云海拾灵图标（代码绘制）：暮色天空、云海、浮岛、灯塔与一只絮灵 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6C9A4"/>
      <stop offset="0.6" stop-color="#F3B94D"/>
      <stop offset="1" stop-color="#E8A06A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6D6" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFF6D6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#sky)"/>
  <circle cx="300" cy="150" r="120" fill="url(#glow)"/>
