  <path d="M16 360 Q80 320 140 350 T260 345 T380 340 T496 350 V392 Q496 496 392 496 H120 Q16 496 16 392 Z" fill="#FFF8EF"/>
  <path d="M16 400 Q90 372 160 398 T300 394 T420 396 T496 402 V420 Q496 496 392 496 H120 Q16 496 16 420 Z" fill="#F1E3D3"/>
  <!-- 浮岛 -->
  <path d="M150 300 L362 300 L330 336 L290 350 L250 372 L214 352 L178 334 Z" fill="#8A6A52"/>
  <path d="M140 300 Q256 262 372 300 Z" fill="#9CCB6E"/>
  <!-- 灯塔 -->
  <path d="M290 296 L300 160 L320 160 L330 296 Z" fill="#E9E1D3"/>
  <rect x="294" y="196" width="32" height="12" fill="#C8573E"/>
  <rect x="292" y="240" width="36" height="12" fill="#C8573E"/>
  <rect x="294" y="136" width="32" height="26" rx="4" fill="#FFF3B0"/>
  <path d="M290 136 L310 112 L330 136 Z" fill="#5A4636"/>
  <circle cx="310" cy="148" r="34" fill="url(#glow)"/>
  <!-- 絮灵（圆滚滚的暖芽） -->
  <ellipse cx="206" cy="270" rx="46" ry="38" fill="#FFE2B0"/>
  <path d="M176 242 L168 210 L192 236 Z" fill="#FFE2B0"/>
  <path d="M236 242 L246 210 L220 236 Z" fill="#FFE2B0"/>
